name: Build MODMASE APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify single DEX
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK not found: $APK"
            exit 1
          fi

          echo "Checking DEX files inside: $APK"

          # Do not use a grep|wc pipeline here. The old check could report 0
          # because grep returns exit code 1 when no line matches, making the
          # verification step fail without showing the real APK contents.
          mapfile -t DEX_FILES < <(
            unzip -l "$APK" | awk '$4 ~ /^classes([0-9]+)?\.dex$/ { print $4 }'
          )

          COUNT="${#DEX_FILES[@]}"
          echo "DEX files: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            printf '%s\n' "${DEX_FILES[@]}"
          fi

          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 DEX file, found $COUNT"
            echo "All DEX-related APK entries:"
            unzip -l "$APK" | grep -E 'classes([0-9]+)?\.dex$' || true
            exit 1
          fi

          echo "Single DEX verification passed."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MODMASE-MIKASA-v3-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
