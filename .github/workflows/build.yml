name: Build MODMASE APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify single DEX
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          COUNT=$(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\\.dex$' | wc -l)
          echo "DEX files: $COUNT"
          unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\\.dex$' || true
          test "$COUNT" -eq 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MODMASE-MIKASA-v3-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
